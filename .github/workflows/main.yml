name: Cloud Build Deployment
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebAssembly Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          cargo install wasm-bindgen-cli wasm-snip

      - name: Compile Lyra Core & Static Assets
        run: |
          bun install
          bun run build-proxy
          bun build:static

      - name: Deploy Compiled Folder to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./dist-static
